name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  # Cancel superseded PR runs only; every push to main keeps its own run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Select packages
        id: select
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          filter="./packages/**"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # Root config changes (tsconfig, biome, lockfile, workflows) affect every package.
            if git diff --name-only "origin/${BASE_REF}...HEAD" \
              | grep -Ev '^(packages/|docs/|\.changeset/)|\.md$' | grep -q .; then
              filter="./packages/**"
            else
              filter="...[origin/${BASE_REF}]"
            fi
          fi
          echo "filter=${filter}" >> "$GITHUB_OUTPUT"
          echo "Package filter: ${filter}"

      - run: pnpm lint

      - run: pnpm --filter "${{ steps.select.outputs.filter }}" run typecheck

      - run: pnpm --filter "${{ steps.select.outputs.filter }}" run test:coverage

      - run: pnpm --filter "${{ steps.select.outputs.filter }}" run build
