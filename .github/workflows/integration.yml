name: Integration

# The senders against real ntfy and apprise-api containers (examples/notify/docker-compose.yml).
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # --wait waits for both healthchecks in the compose file (apprise: until /status answers).
      - name: Start ntfy and apprise-api
        run: docker compose -f examples/notify/docker-compose.yml up -d --wait --wait-timeout 120

      # The tests throw instead of skipping when CI is set and these are missing.
      - run: pnpm test:integration
        env:
          NTFY_URL: http://localhost:8080
          APPRISE_URL: http://localhost:8000

      - name: Container logs
        if: failure()
        run: docker compose -f examples/notify/docker-compose.yml logs
