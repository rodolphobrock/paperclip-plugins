name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    if: github.repository == 'rodolphobrock/paperclip-plugins'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      # npm's trusted publishing guide: registry-url set, no dependency cache in release builds.
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      # Trusted publishing (OIDC) needs npm CLI 11.5.1 or later.
      - run: npm install -g npm@^11.5.1

      - run: pnpm install --frozen-lockfile

      # Publish only what passes the same checks as CI.
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

      # Opens or updates the "Version packages" PR while changesets are pending. It is not given a
      # publish command, so it never writes an .npmrc with a token.
      - uses: changesets/action@v1
        id: changesets
        with:
          version: pnpm version-packages
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # After the version PR is merged: publish with npm trusted publishing (OIDC, automatic
      # provenance, no NPM_TOKEN) and push the release tags. Private packages are skipped.
      - name: Publish
        if: steps.changesets.outputs.hasChangesets == 'false'
        run: |
          pnpm exec changeset publish
          git push origin --tags
