name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    if: github.repository == 'rodolphobrock/paperclip-plugins'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      # npm's trusted publishing guide: registry-url set, no dependency cache in release builds.
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      # Trusted publishing (OIDC) needs npm CLI 11.5.1 or later.
      - run: npm install -g npm@^11.5.1

      - run: pnpm install --frozen-lockfile

      # Publish only what passes the same checks as CI.
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

      # Opens or updates the "Version packages" PR while changesets are pending. It is not given a
      # publish command, so it never writes an .npmrc with a token.
      - uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1
        id: changesets
        with:
          version: pnpm version-packages
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Skips the registry round-trips while every package is still private.
      - name: Count publishable packages
        id: publishable
        run: |
          count=$(node -e 'const fs = require("node:fs"); let n = 0; for (const d of fs.readdirSync("packages")) { const p = JSON.parse(fs.readFileSync(`packages/${d}/package.json`, "utf8")); if (!p.private) n++; } console.log(n)')
          echo "count=${count}" >> "$GITHUB_OUTPUT"

      # After the version PR is merged: publish with npm trusted publishing (OIDC, automatic
      # provenance, no NPM_TOKEN) and push the release tags. Private packages are skipped, and
      # versions already on npm are not published again.
      - name: Publish
        if: steps.changesets.outputs.hasChangesets == 'false' && steps.publishable.outputs.count != '0'
        run: |
          pnpm exec changeset publish
          git push origin --tags
