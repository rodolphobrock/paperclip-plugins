# ntfy and apprise-api for local tests of the notifier plugins.
#   docker compose -f examples/notify/docker-compose.yml up -d
# ntfy:        http://localhost:8080 (the apprise container reaches it as http://ntfy)
# apprise-api: http://localhost:8000
services:
  ntfy:
    image: binwiederhier/ntfy:v2.28.0
    command: serve
    environment:
      NTFY_BASE_URL: http://localhost:8080
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --tries=1 -O- http://localhost:80/v1/health | grep -q healthy"]
      interval: 5s
      timeout: 3s
      retries: 20

  apprise:
    image: caronc/apprise:2.0.0
    environment:
      # Both modes on: stateful (/add, /notify/{key}) and stateless (/notify with urls).
      APPRISE_STATEFUL_MODE: simple
      APPRISE_WORKER_COUNT: "1"
    ports:
      - "8000:8000"
    # The image's own healthcheck turns healthy before the app workers answer (nginx returns 502);
    # /status only answers once they do.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/status >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    depends_on:
      ntfy:
        condition: service_healthy
